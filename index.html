<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2db875">
  <title>IF Sync</title>
  <link rel="manifest" href="manifest.json">
  <meta name="application-name" content="IF Sync">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IF Sync">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #8ff0c5;
      color: #111;
      min-height: 100vh;
    }

    header {
      background: #2db875;
      color: white;
      text-align: center;
      padding: 22px 16px;
      font-size: 25px;
      font-weight: bold;
    }

    main {
      width: min(700px, 92%);
      margin: 22px auto 120px;
    }

    .tela { display: none; }
    .tela.ativa { display: block; }

    .card {
      background: white;
      border-radius: 20px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .card-cabecalho {
      width: 100%;
      border: 0;
      background: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .card-cabecalho:hover { background: #fafafa; }

    .titulo-tipo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .seta {
      font-size: 18px;
      transition: transform .2s;
    }

    .card.aberto .seta { transform: rotate(180deg); }

    .conteudo {
      display: none;
      background: #f2f2f2;
      padding: 18px 20px 20px;
      line-height: 1.5;
    }

    .card.aberto .conteudo { display: block; }

    .texto-aviso {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .prazo {
      margin-top: 14px;
      font-size: 13px;
      color: #555;
    }

    .card.prova .card-cabecalho { background: #ffeaea; }
    .card.tarefa.concluida .card-cabecalho {
      background: #d8f5e5;
      color: #276b48;
    }

    .botao-concluir {
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      background: #2db875;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-concluir.desmarcar {
      background: #777;
    }

    .vazio {
      background: rgba(255,255,255,.75);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      color: #555;
    }

    .botao-principal {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px;
      background: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
      margin-bottom: 14px;
    }

    .formulario {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .formulario.visivel { display: block; }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    label:first-child { margin-top: 0; }

    select, textarea, input[type="date"] {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .acoes-form {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .acoes-form button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .salvar { background: #2db875; color: white; }
    .cancelar { background: #e8e8e8; color: #222; }

    .modo-edicao {
      margin-bottom: 15px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e8f8ef;
      color: #236342;
      font-weight: bold;
      font-size: 14px;
    }

    .gerenciar-titulo {
      font-size: 19px;
      font-weight: bold;
      margin: 24px 0 10px;
    }

    .gerenciar-item {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .gerenciar-item strong {
      display: block;
      margin-bottom: 6px;
    }

    .gerenciar-item small {
      color: #666;
      display: block;
      margin-bottom: 12px;
    }

    .botoes-gerenciar {
      display: flex;
      gap: 8px;
    }

    .botoes-gerenciar button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .editar { background: #e8f8ef; color: #236342; }
    .excluir { background: #ffe2e2; color: #a22; }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 78px;
      padding: 9px 12px 12px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 -3px 12px rgba(0,0,0,.08);
    }

    nav button {
      border: 0;
      border-radius: 15px;
      background: #f0f0f0;
      padding: 11px 18px;
      min-width: 130px;
      font-weight: bold;
      cursor: pointer;
    }

    nav button.ativo {
      background: #2db875;
      color: white;
    }

    @media (max-width: 480px) {
      header { font-size: 22px; }
      nav { min-height: 86px; }
      nav button { min-width: 0; flex: 1; }
    }

    .tela-entrada {
  position: fixed;
  inset: 0;
  background: #8ff0c5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.caixa-entrada {
  width: min(420px, 100%);
  background: white;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.caixa-entrada h1 {
  margin: 0 0 8px;
  text-align: center;
  color: #2db875;
}

.caixa-entrada p {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.caixa-entrada label {
  display: block;
  font-weight: bold;
  margin: 14px 0 7px;
}

.caixa-entrada input {
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 12px;
  padding: 13px;
  font: inherit;
}

.caixa-entrada button {
  width: 100%;
  margin-top: 20px;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  background: #2db875;
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

#erroEntrada {
  margin-top: 14px;
  color: #a22;
  text-align: center;
  font-size: 14px;
}
    
  </style>
</head>

<body>

  <div id="telaEntrada" class="tela-entrada">
  <div class="caixa-entrada">
    <h1>IF Sync</h1>
    <p>Entre com seu nome + inicial do sobrenome e o código da turma.</p>

    <label for="nomeEntrada">Nome</label>
    <input
      type="text"
      id="nomeEntrada"
      placeholder="Ex.: Lucas C"
    >

    <label for="codigoEntrada">Código da turma</label>
    <input
      type="password"
      id="codigoEntrada"
      placeholder="Digite o código"
    >

    <button onclick="entrarNoIFSync()">
      Entrar
    </button>

    <div id="erroEntrada"></div>
  </div>
</div>
  
  <header>Automação 2</header>

  <main>
    <!-- TELA DE AVISOS -->
    <section id="telaAvisos" class="tela ativa">
      <div id="listaAvisos"></div>
    </section>

    <!-- TELA DE ADICIONAR / GERENCIAR -->
    <section id="telaAdicionar" class="tela">
      <button class="botao-principal" onclick="abrirFormulario()">
        ➕ Avisar
      </button>

      <div id="formulario" class="formulario">
        <div id="modoEdicao" class="modo-edicao" style="display:none;">
          ✏️ Editando aviso
        </div>

        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="aviso">📢 Aviso</option>
          <option value="tarefa">📝 Tarefa de casa</option>
          <option value="prova">🧪 Prova</option>
        </select>

        <label for="texto">Mensagem</label>
        <textarea id="texto" placeholder="Digite o aviso..."></textarea>

        <label for="prazo">Data de encerramento</label>
        <input type="date" id="prazo">

        <div class="acoes-form">
          <button class="cancelar" onclick="cancelarFormulario()">Cancelar</button>
          <button class="salvar" onclick="salvarAviso()">Salvar</button>
        </div>
      </div>

      <div class="gerenciar-titulo">🗂️ Gerenciar avisos</div>
      <div id="listaGerenciamento"></div>
    </section>
  </main>

  <nav>
    <button id="navAvisos" class="ativo" onclick="mostrarTela('avisos')">
      📢 Avisos
    </button>
    <button id="navAdicionar" style="display:none;" onclick="mostrarTela('adicionar')">
  ➕ Adicionar
</button>
  </nav>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ===============================
    // SUPABASE
    // ===============================
    const SUPABASE_URL = "https://ghtbeyhilklikelujrty.supabase.co";
    const SUPABASE_KEY = "sb_publishable_F0r8m3uQz22MskigxqBBhQ_vfGCxJIG";
    const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
    

    let avisos = [];
    let idEmEdicao = null;

    let membroAtual = null;

function salvarMembroAtual(membro) {
  membroAtual = membro;

  localStorage.setItem(
    "ifSyncMembro",
    JSON.stringify(membro)
  );
}

function carregarMembroAtual() {
  const salvo = localStorage.getItem("ifSyncMembro");

  if (!salvo) return null;

  try {
    membroAtual = JSON.parse(salvo);
    return membroAtual;
  } catch {
    localStorage.removeItem("ifSyncMembro");
    return null;
  }
}

    async function entrarNoIFSync() {
  const nome = document
    .getElementById("nomeEntrada")
    .value
    .trim();

  const codigo = document
    .getElementById("codigoEntrada")
    .value
    .trim();

  const erro = document.getElementById("erroEntrada");

  erro.textContent = "";

  if (!nome) {
    erro.textContent = "Digite seu nome.";
    return;
  }

  if (!codigo) {
    erro.textContent = "Digite o código da turma.";
    return;
  }

  const { data, error } = await supabaseClient.rpc(
    "entrar_no_if_sync",
    {
      p_nome: nome,
      p_codigo: codigo
    }
  );

  if (error) {
    console.error("Erro ao entrar:", error);
    erro.textContent = "Código ou nome inválido.";
    return;
  }

  if (!data || data.length === 0) {
    erro.textContent = "Não foi possível identificar você.";
    return;
  }

  const membro = data[0];

  salvarMembroAtual({
    membro_id: membro.membro_id,
    turma_id: membro.turma_id,
    perfil: membro.perfil,
    funcao_admin: membro.funcao_admin,
    nome: nome
  });

  iniciarAplicativo();
}

    function iniciarAplicativo() {
  const telaEntrada = document.getElementById("telaEntrada");

  telaEntrada.style.display = "none";

  const navAdicionar = document.getElementById("navAdicionar");
  const telaAdicionar = document.getElementById("telaAdicionar");

  if (membroAtual.perfil === "admin") {
    navAdicionar.style.display = "";
  } else {
    navAdicionar.style.display = "none";
    telaAdicionar.classList.remove("ativa");
    document.getElementById("telaAvisos").classList.add("ativa");
  }

  carregarAvisos();
}
    
    async function carregarAvisos() {
      const { data, error } = await supabaseClient
        .from("Avisos")
        .select("id, tipo, texto, prazo, concluído, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Erro ao carregar avisos do Supabase:", error);

        // Mantém os avisos locais como fallback durante o teste.
        avisos = JSON.parse(localStorage.getItem("avisosAutomacao2") || "[]");
        mostrarAvisos();
        mostrarGerenciamento();
        return;
      }

      avisos = data || [];
      mostrarAvisos();
      mostrarGerenciamento();
    }

    function gerarId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function dataHoje() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, "0");
      const dia = String(agora.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function formatarData(data) {
      if (!data) return "Sem prazo";
      const [ano, mes, dia] = data.split("-");
      return `${dia}/${mes}/${ano}`;
    }

    function salvarNoStorage() {
      localStorage.setItem("avisosAutomacao2", JSON.stringify(avisos));
    }

    function verificarPrazos() {
      const hoje = dataHoje();
      const antes = avisos.length;

      // O aviso fica disponível até o dia escolhido.
      // Ele é removido automaticamente a partir do dia seguinte.
      avisos = avisos.filter(aviso => !aviso.prazo || aviso.prazo >= hoje);

      if (avisos.length !== antes) {
        salvarNoStorage();
      }
    }

    function escaparHTML(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    function infoTipo(tipo) {
      if (tipo === "tarefa") return { icone: "📝", nome: "Tarefa de casa" };
      if (tipo === "prova") return { icone: "🧪", nome: "Prova" };
      return { icone: "📢", nome: "Aviso" };
    }

    function mostrarAvisos() {
      verificarPrazos();

      const container = document.getElementById("listaAvisos");
      container.innerHTML = "";

      if (avisos.length === 0) {
        container.innerHTML = `
          <div class="vazio">
            <strong>Nenhum aviso por enquanto.</strong><br>
            Os avisos da turma aparecerão aqui.
          </div>
        `;
        return;
      }

      avisos.forEach(aviso => {
        const info = infoTipo(aviso.tipo);

        const card = document.createElement("div");
        card.className =
          `card ${aviso.tipo} ${aviso.concluida ? "concluida" : ""}`;

        const botao = aviso.tipo === "tarefa"
          ? `
            <button class="botao-concluir ${aviso.concluida ? "desmarcar" : ""}"
                    onclick="alternarConclusao(event, '${aviso.id}')">
              ${aviso.concluida ? "↩ Desmarcar" : "✓ Concluído"}
            </button>
          `
          : "";

        card.innerHTML = `
          <button class="card-cabecalho" onclick="abrirCard(this)">
            <span class="titulo-tipo">
              <span>${info.icone}</span>
              <span>${info.nome}</span>
            </span>
            <span class="seta">⌄</span>
          </button>

          <div class="conteudo">
            <div class="texto-aviso">${escaparHTML(aviso.texto)}</div>
            <div class="prazo">
              Encerra em: <strong>${formatarData(aviso.prazo)}</strong>
            </div>
            ${botao}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function abrirCard(botao) {
      const card = botao.closest(".card");
      card.classList.toggle("aberto");
    }

    function abrirFormulario() {
      idEmEdicao = null;
      document.getElementById("modoEdicao").style.display = "none";
      document.getElementById("tipo").value = "aviso";
      document.getElementById("texto").value = "";
      document.getElementById("prazo").value = "";

      const form = document.getElementById("formulario");
      form.classList.add("visivel");
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function cancelarFormulario() {
      idEmEdicao = null;
      document.getElementById("formulario").classList.remove("visivel");
      document.getElementById("modoEdicao").style.display = "none";
      limparFormulario();
    }

    function limparFormulario() {
      document.getElementById("tipo").value = "aviso";
      document.getElementById("texto").value = "";
      document.getElementById("prazo").value = "";
    }

    function salvarAviso() {
      const tipo = document.getElementById("tipo").value;
      const texto = document.getElementById("texto").value.trim();
      const prazo = document.getElementById("prazo").value;

      if (!texto) {
        alert("Digite uma mensagem.");
        return;
      }

      if (!prazo) {
        alert("Escolha a data de encerramento.");
        return;
      }

      if (prazo < dataHoje()) {
        alert("A data de encerramento não pode ser anterior a hoje.");
        return;
      }

      if (idEmEdicao) {
        const aviso = avisos.find(a => a.id === idEmEdicao);

        if (aviso) {
          aviso.tipo = tipo;
          aviso.texto = texto;
          aviso.prazo = prazo;
        }
      } else {
        avisos.unshift({
          id: gerarId(),
          tipo: tipo,
          texto: texto,
          prazo: prazo,
          concluida: false
        });
      }

      salvarNoStorage();
      cancelarFormulario();
      mostrarAvisos();
      mostrarGerenciamento();
      mostrarTela("avisos");
    }

    function editarAviso(id) {
      const aviso = avisos.find(a => a.id === id);
      if (!aviso) return;

      idEmEdicao = id;

      document.getElementById("tipo").value = aviso.tipo;
      document.getElementById("texto").value = aviso.texto;
      document.getElementById("prazo").value = aviso.prazo;
      document.getElementById("modoEdicao").style.display = "block";

      const form = document.getElementById("formulario");
      form.classList.add("visivel");
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function excluirAviso(id) {
      const aviso = avisos.find(a => a.id === id);
      if (!aviso) return;

      if (!confirm("Excluir este aviso permanentemente?")) return;

      avisos = avisos.filter(a => a.id !== id);
      salvarNoStorage();

      // Atualiza imediatamente as duas telas/listas.
      mostrarAvisos();
      mostrarGerenciamento();
    }

    function alternarConclusao(event, id) {
      event.stopPropagation();

      const aviso = avisos.find(a => a.id === id);
      if (!aviso || aviso.tipo !== "tarefa") return;

      aviso.concluida = !aviso.concluida;
      salvarNoStorage();
      mostrarAvisos();
    }

    function mostrarGerenciamento() {
      verificarPrazos();

      const container = document.getElementById("listaGerenciamento");
      container.innerHTML = "";

      if (avisos.length === 0) {
        container.innerHTML = `
          <div class="vazio">
            Nenhum aviso para gerenciar.
          </div>
        `;
        return;
      }

      avisos.forEach(aviso => {
        const info = infoTipo(aviso.tipo);

        const item = document.createElement("div");
        item.className = "gerenciar-item";

        item.innerHTML = `
          <strong>${info.icone} ${info.nome}</strong>
          <div>${escaparHTML(aviso.texto)}</div>
          <small>Encerra em ${formatarData(aviso.prazo)}</small>

          <div class="botoes-gerenciar">
            <button class="editar" onclick="editarAviso('${aviso.id}')">
              ✏️ Editar
            </button>
            <button class="excluir" onclick="excluirAviso('${aviso.id}')">
              🗑️ Excluir
            </button>
          </div>
        `;

        container.appendChild(item);
      });
    }

    function mostrarTela(tela) {
      const avisosTela = document.getElementById("telaAvisos");
      const adicionarTela = document.getElementById("telaAdicionar");
      const navAvisos = document.getElementById("navAvisos");
      const navAdicionar = document.getElementById("navAdicionar");

      if (tela === "avisos") {
        avisosTela.classList.add("ativa");
        adicionarTela.classList.remove("ativa");
        navAvisos.classList.add("ativo");
        navAdicionar.classList.remove("ativo");
        mostrarAvisos();
      } else {
        avisosTela.classList.remove("ativa");
        adicionarTela.classList.add("ativa");
        navAvisos.classList.remove("ativo");
        navAdicionar.classList.add("ativo");
        mostrarGerenciamento();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Primeira renderização: busca os avisos no Supabase.
    const membroSalvo = carregarMembroAtual();

if (membroSalvo) {
  iniciarAplicativo();
}

    // Verifica prazos automaticamente enquanto a página estiver aberta.
    setInterval(() => {
      carregarAvisos();
    }, 60000);
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .catch(err => console.log("Service Worker:", err));
      });
    }
  </script>
</body>
</html>
